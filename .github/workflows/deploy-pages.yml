name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tested main commit
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      eligible: ${{ steps.commit.outputs.eligible }}
    steps:
      - name: Require successful CI for the exact current main commit
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          latest_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$TARGET_SHA" != "$latest_sha" ]]; then
            echo "Skipping an older commit; main has advanced."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          successful_runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$TARGET_SHA&status=success&per_page=20")"
          count="$(jq --arg sha "$TARGET_SHA" --arg repo "$GITHUB_REPOSITORY" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .conclusion == "success" and .head_repository.full_name == $repo and (.event == "push" or .event == "workflow_dispatch"))] | length' <<< "$successful_runs")"
          if [[ "$count" == "0" ]]; then
            echo "::error::This main commit has no successful CI run. Run CI before publishing."
            exit 1
          fi
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "eligible=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: verify
    if: needs.verify.outputs.eligible == 'true'
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: Build the tested WebAssembly application and matching runtime
        run: |
          GOOS=js GOARCH=wasm go build -o docs/main.wasm ./cmd/wasm
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" docs/wasm_exec.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        id: pages-artifact
        with:
          path: docs
      - name: Wait for the exact Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.verify.outputs.sha }}
          EXPECTED_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          deadline=$((SECONDS + 180))
          observations=0
          while (( SECONDS < deadline )); do
            request_timeout=$((deadline - SECONDS))
            if (( request_timeout <= 0 )); then
              break
            fi
            if (( request_timeout > 10 )); then
              request_timeout=10
            fi
            if artifacts="$(timeout "${request_timeout}s" gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100")"; then
              visible="$(jq -r --arg sha "$TARGET_SHA" --arg run "$GITHUB_RUN_ID" --arg id "$EXPECTED_ARTIFACT_ID" '[.artifacts[] | select(.name == "github-pages" and .expired == false and (.workflow_run.id | tostring) == $run and .workflow_run.head_sha == $sha)] | (length == 1 and (.[0].id | tostring) == $id)' <<< "$artifacts")"
              if [[ "$visible" == "true" ]]; then
                observations=$((observations + 1))
                if (( observations >= 2 )); then
                  echo "The exact Pages artifact is visible and ready for publication."
                  exit 0
                fi
                echo "Pages artifact found; confirming visibility after propagation."
              else
                observations=0
                echo "Waiting for the exact unexpired Pages artifact."
              fi
            else
              observations=0
              echo "Artifact metadata is temporarily unavailable; retrying."
            fi
            remaining=$((deadline - SECONDS))
            if (( remaining <= 0 )); then
              break
            fi
            if (( remaining < 10 )); then
              sleep "$remaining"
            else
              sleep 10
            fi
          done
          echo "::error::The exact unexpired github-pages artifact did not become consistently visible within three minutes. Publication stopped; retry this workflow after the artifact service recovers."
          exit 1
      - name: Publish tested site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
