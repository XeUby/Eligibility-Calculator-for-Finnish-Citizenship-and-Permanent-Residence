name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 2"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
      - uses: github/codeql-action/init@v4
        with:
          languages: go
      - name: Build Go packages for analysis
        run: go build ./...
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:go"
