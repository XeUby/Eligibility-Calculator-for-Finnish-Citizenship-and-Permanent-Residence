name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          check-latest: true
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build WebAssembly
        run: GOOS=js GOARCH=wasm go build -o docs/main.wasm ./cmd/wasm

  browser:
    name: Browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Build WebAssembly and matching Go runtime
        run: |
          GOOS=js GOARCH=wasm go build -o docs/main.wasm ./cmd/wasm
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" docs/wasm_exec.js
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
