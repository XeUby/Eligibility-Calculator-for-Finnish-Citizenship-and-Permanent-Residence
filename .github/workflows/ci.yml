name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build WebAssembly
        run: GOOS=js GOARCH=wasm go build -o docs/main.wasm ./cmd/wasm

  browser:
    name: Browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Build WebAssembly and matching Go runtime
        run: |
          GOOS=js GOARCH=wasm go build -o docs/main.wasm ./cmd/wasm
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" docs/wasm_exec.js
      - run: npm ci --ignore-scripts
      - name: Check translations and maintenance metadata
        run: |
          npm run test:unit
          npm run test:review
      - run: npx --no-install playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Validate production smoke against the local build
        env:
          FINRESIDENCE_SMOKE_BASE_URL: http://127.0.0.1:8090/
          PORT: 8090
        run: |
          set -euo pipefail
          go build -o /tmp/finresidence-smoke-server ./cmd/server
          /tmp/finresidence-smoke-server > /tmp/finresidence-smoke-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/finresidence-smoke-server.log
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:8090/healthz > /dev/null; then
              break
            fi
            sleep 1
          done
          kill -0 "$server_pid"
          curl --fail --silent http://127.0.0.1:8090/healthz > /dev/null
          npm run test:production
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
