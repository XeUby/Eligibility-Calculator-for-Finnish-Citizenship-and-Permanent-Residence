name: Rules review

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "35 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rules-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate manual review dates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node --test scripts/check-review.test.mjs
      - run: node scripts/check-review.mjs

  reminder:
    name: Maintain one review reminder issue
    needs: validate
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Create, update or resolve the single maintenance issue
        run: node scripts/check-review.mjs --issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
